<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RIGNITC | Login</title>
    <link rel="icon" type="image/png" href="/pr-preview/pr-7/assets/images/logog.webp" />
    <link rel="stylesheet" href="/pr-preview/pr-7/src/styles/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Custom logo styling for login page */
      .login-logo {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 50px;
        height: 50px;
        z-index: 1000;
        transition: transform 0.3s ease;
      }
      
      .login-logo:hover {
        transform: scale(1.1);
      }
      
      .login-logo img {
        width: 100%;
        height: auto;
        display: block;
        filter: grayscale(1) invert(1);
      }
    </style>
  </head>

  <body>
    <!-- Logo only, no navbar -->
    <a href="/pr-preview/pr-7/" class="login-logo">
      <img src="/pr-preview/pr-7/assets/images/logog.webp" alt="RIGNITC logo">
    </a>
    
    <main>
      <section class="hero" aria-labelledby="Login">
        <div class="centered">
          <h1 id="Login">Login</h1>
        </div>
      </section>

      <section class="blog-form-section" id="blog-form-section">
        <div class="container">
          <form id="blog-form">
            <div class="form-group">
              <label for="email">Enter your registered Email ID</label>
              <input
                type="email"
                id="email"
                name="email"
                required
              />
            </div>

            <button type="submit" class="submit-btn">Verify Email</button>
            <p id="error-message" style="color: red; display: none; margin-top: 10px;"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="/pr-preview/pr-7/src/scripts/email-verify.js"></script>
    <script>
      // Check if user is already logged in, redirect to blog-input
      if (isUserLoggedIn()) {
        window.location.href = '/src/pages/blog-input/index.html';
      }

      // Handle form submission
      document.getElementById('blog-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.querySelector('.submit-btn');
        
        // Disable button and show loading
        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying...';
        errorMessage.style.display = 'none';
        
        try {
          // Call the verification function
          const userData = await verifyEmail(email);
          
          if (userData) {
            // Store email and name in session storage
            sessionStorage.setItem('userEmail', userData.email);
            sessionStorage.setItem('userName', userData.name);
            
            // Redirect to blog input page
            window.location.href = '/src/pages/blog-input/index.html';
          } else {
            errorMessage.textContent = 'Email not found in authorized list. Please contact admin.';
            errorMessage.style.display = 'block';
          }
        } catch (error) {
          errorMessage.textContent = 'Error verifying email. Please try again.';
          errorMessage.style.display = 'block';
          console.error('Verification error:', error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Verify Email';
        }
      });
    </script>
  </body>
</html>
