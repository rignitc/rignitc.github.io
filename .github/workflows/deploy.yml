name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write # Required to post the preview link in comments

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install dependencies 📦
        run: npm install

      - name: Build Site 🏗️
        run: npm run build

      # --- PREVIEW LOGIC FOR PULL REQUESTS ---
      - name: Deploy Preview 🚀
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          preview-branch: gh-pages # It will host previews in subfolders on this branch
          umbrella-dir: pr-preview

      # --- PRODUCTION DEPLOY FOR MAIN ---
      - name: Upload Production Artifact ⬆️
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: build-and-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
