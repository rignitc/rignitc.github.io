name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

# Set permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write # Required if you want to post comments later

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install dependencies 📦
        run: npm install

      - name: Build Site 🏗️
        run: npm run build

      # --- INTERNAL PREVIEW LOGIC ---
      # This tricks GitHub Pages into hosting a preview in a subfolder
      - name: Prepare Preview Subfolder 📂
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=${{ github.event.number }}
          mkdir -p dist/preview/pr-$PR_NUMBER
          # Copy the build into the subfolder so it can be viewed at /preview/pr-XX/
          cp -r dist/* dist/preview/pr-$PR_NUMBER/ || true
          echo "PREVIEW_URL=https://rignitc.com/preview/pr-$PR_NUMBER/" >> $GITHUB_ENV

      - name: Upload Artifact ⬆️
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    # Only deploy to the live site on pushes to main
    # PRs will build and upload the artifact to check for errors, 
    # but only 'main' triggers the actual deployment to rignitc.com
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
